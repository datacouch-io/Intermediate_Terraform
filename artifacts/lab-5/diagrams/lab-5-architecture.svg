<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#40474f"/></marker></defs><rect width="900" height="900" fill="#ffffff"/><text x="24" y="42" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#1b1f23">Lab 5 — one codebase, two environments</text><text x="24" y="66" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#5a636c">Modules make the code reusable; workspaces give each environment its own state.</text><rect x="24" y="80" width="852" height="118" rx="7" fill="#e8f0fb" stroke="#2b5fa8" stroke-width="1.4"/><text x="38" y="101" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#2b5fa8">ONE ROOT CONFIGURATION — written once</text><text x="38" y="118" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">locals.env_settings = { dev = {...}, prod = {...} }</text><text x="38" y="135" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">local.env = local.env_settings[terraform.workspace]   &lt;- selects the row</text><text x="38" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">module "vpc"  source = terraform-aws-modules/vpc/aws  version ~&gt; 5.0  (EXTERNAL)</text><text x="38" y="169" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">module "web"  source = ./modules/web-server                          (LOCAL)</text><line x1="450" y1="202" x2="450" y2="223" stroke="#40474f" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="217" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#2b5fa8">terraform workspace select</text><rect x="24" y="232" width="416" height="135" rx="7" fill="#f4f6f8" stroke="#40474f" stroke-width="1.4"/><text x="38" y="253" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#40474f">workspace: dev</text><text x="38" y="270" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">terraform.tfstate.d/dev/terraform.tfstate</text><text x="38" y="287" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">14 objects in state</text><text x="38" y="304" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">instance_type  = t3.micro</text><text x="38" y="321" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">instance_count = 1</text><text x="38" y="338" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">vpc_cidr = 10.51.0.0/16</text><rect x="460" y="232" width="416" height="135" rx="7" fill="#f4f6f8" stroke="#40474f" stroke-width="1.4"/><text x="474" y="253" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#40474f">workspace: prod</text><text x="474" y="270" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">terraform.tfstate.d/prod/terraform.tfstate</text><text x="474" y="287" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">15 objects in state</text><text x="474" y="304" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">instance_type  = t3.small</text><text x="474" y="321" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">instance_count = 2</text><text x="474" y="338" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">vpc_cidr = 10.52.0.0/16</text><line x1="450" y1="371" x2="450" y2="392" stroke="#40474f" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="386" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#2b5fa8">terraform apply</text><rect x="24" y="401" width="416" height="118" rx="7" fill="#e6f4ea" stroke="#1e7a45" stroke-width="1.4"/><text x="38" y="422" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1e7a45">dev  — 13 resources</text><text x="38" y="439" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">vpc-06a24fe4115c508ee  10.51.0.0/16</text><text x="38" y="456" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">tflab5-dev-web-1  t3.micro  10.51.1.224</text><text x="38" y="473" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">http://52.54.184.11</text><rect x="460" y="401" width="416" height="118" rx="7" fill="#e6f4ea" stroke="#1e7a45" stroke-width="1.4"/><text x="474" y="422" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1e7a45">prod — 14 resources</text><text x="474" y="439" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">vpc-0820337b8977d1356  10.52.0.0/16</text><text x="474" y="456" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">tflab5-prod-web-1  t3.small  10.52.1.57</text><text x="474" y="473" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">tflab5-prod-web-2  t3.small  10.52.1.150</text><text x="474" y="490" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">http://54.147.98.196  +  http://52.91.232.252</text><line x1="450" y1="523" x2="450" y2="544" stroke="#40474f" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="538" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#2b5fa8">the proof</text><rect x="24" y="553" width="852" height="118" rx="7" fill="#e6f4ea" stroke="#1e7a45" stroke-width="1.4"/><text x="38" y="574" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1e7a45">SAME CODE, ZERO SHARED RESOURCES</text><text x="38" y="591" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">not one .tf file differs between the two environments</text><text x="38" y="608" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">the only input that changed is the value of terraform.workspace</text><text x="38" y="625" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">validation: 15 checks, including 'dev and prod share ZERO instances'</text><text x="38" y="642" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">destroy is per-workspace: 13 destroyed, then 14 destroyed</text><line x1="450" y1="675" x2="450" y2="696" stroke="#40474f" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="690" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#2b5fa8">the trap</text><rect x="24" y="705" width="852" height="118" rx="7" fill="#fdf0e3" stroke="#a5651a" stroke-width="1.4"/><text x="38" y="726" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#a5651a">WORKSPACES ARE NOT FREE OF SHARP EDGES</text><text x="38" y="743" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">the default workspace has no settings row -&gt; every plan fails</text><text x="38" y="760" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">a lifecycle precondition does NOT catch it: module args evaluate first</text><text x="38" y="777" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">local.env_settings[terraform.workspace] gives the readable error instead</text><text x="38" y="794" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">one backend, one credential set: workspaces do not isolate blast radius</text></svg>