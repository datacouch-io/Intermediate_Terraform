<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#40474f"/></marker></defs><rect width="900" height="900" fill="#ffffff"/><text x="24" y="42" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#1b1f23">Lab 3 — state as the contract between config and reality</text><text x="24" y="66" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#5a636c">Three parties: what you declared, what Terraform recorded, what AWS actually has.</text><rect x="24" y="80" width="270" height="118" rx="7" fill="#e8f0fb" stroke="#2b5fa8" stroke-width="1.4"/><text x="38" y="101" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#2b5fa8">CONFIG (.tf)</text><text x="38" y="118" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">what you declared</text><text x="38" y="135" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">monitoring = false</text><text x="38" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">Name = tf-lab3-managed</text><text x="38" y="169" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">always the source of truth</text><rect x="314" y="80" width="270" height="118" rx="7" fill="#f4f6f8" stroke="#40474f" stroke-width="1.4"/><text x="328" y="101" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#40474f">STATE (.tfstate)</text><text x="328" y="118" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">what Terraform last recorded</text><text x="328" y="135" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">serial: 2  lineage: 16cae29c-...</text><text x="328" y="152" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">63 attributes for the instance</text><text x="328" y="169" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">a cache, not an authority</text><rect x="604" y="80" width="270" height="118" rx="7" fill="#e6f4ea" stroke="#1e7a45" stroke-width="1.4"/><text x="618" y="101" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1e7a45">AWS (reality)</text><text x="618" y="118" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">what actually exists</text><text x="618" y="135" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">i-06840147e4adbe314</text><text x="618" y="152" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">anyone with console access</text><text x="618" y="169" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">can change this</text><line x1="450" y1="202" x2="450" y2="223" stroke="#40474f" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="217" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#2b5fa8">someone opens the console</text><rect x="24" y="232" width="852" height="101" rx="7" fill="#fdf0e3" stroke="#a5651a" stroke-width="1.4"/><text x="38" y="253" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#a5651a">DRIFT INDUCED — three kinds at once</text><text x="38" y="270" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">aws ec2 create-tags  Key=CostCentre   -&gt; a tag Terraform never knew about</text><text x="38" y="287" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">aws ec2 create-tags  Key=Name=renamed-by-hand  -&gt; a tag Terraform DOES manage</text><text x="38" y="304" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">aws ec2 monitor-instances  -&gt; monitoring false -&gt; true, not a tag at all</text><line x1="450" y1="337" x2="450" y2="358" stroke="#40474f" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="352" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#2b5fa8">two different questions</text><rect x="24" y="367" width="416" height="118" rx="7" fill="#fdf0e3" stroke="#a5651a" stroke-width="1.4"/><text x="38" y="388" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#a5651a">terraform plan  (what should change?)</text><text x="38" y="405" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">~ monitoring  true -&gt; false</text><text x="38" y="422" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">- CostCentre  finance-42 -&gt; null</text><text x="38" y="439" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">~ Name  renamed-by-hand -&gt; tf-lab3-managed</text><text x="38" y="456" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">proposes reverting REALITY to config</text><rect x="460" y="367" width="416" height="118" rx="7" fill="#f4f6f8" stroke="#40474f" stroke-width="1.4"/><text x="474" y="388" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#40474f">apply -refresh-only  (what did change?)</text><text x="474" y="405" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">~ monitoring  false -&gt; true</text><text x="474" y="422" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">+ CostCentre  finance-42</text><text x="474" y="439" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">~ Name  tf-lab3-managed -&gt; renamed-by-hand</text><text x="474" y="456" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">updates STATE to match reality</text><line x1="450" y1="489" x2="450" y2="510" stroke="#40474f" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="504" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#2b5fa8">adopting an orphan</text><rect x="24" y="519" width="852" height="118" rx="7" fill="#f4f6f8" stroke="#40474f" stroke-width="1.4"/><text x="38" y="540" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#40474f">IMPORT — a resource Terraform did not create</text><text x="38" y="557" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">aws ec2 create-security-group  -&gt; sg-0ab343605a031e76c   (outside Terraform)</text><text x="38" y="574" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">import { to = aws_security_group.imported, id = "sg-0ab..." }</text><text x="38" y="591" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">terraform plan -generate-config-out=generated.tf  -&gt; Terraform writes the HCL</text><text x="38" y="608" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">terraform apply  -&gt; Resources: 1 imported, 0 added, 0 changed, 0 destroyed</text><line x1="450" y1="641" x2="450" y2="662" stroke="#40474f" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="656" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#2b5fa8">the proof</text><rect x="24" y="671" width="852" height="118" rx="7" fill="#e6f4ea" stroke="#1e7a45" stroke-width="1.4"/><text x="38" y="692" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1e7a45">IMPORTED CORRECTLY, OR ONLY IMPORTED?</text><text x="38" y="709" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">terraform plan -&gt; No changes. Your infrastructure matches the configuration.</text><text x="38" y="726" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">state list alone proves nothing: a WRONG config imports just as happily</text><text x="38" y="743" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">with one ingress rule missing from the config, plan proposed to DELETE</text><text x="38" y="760" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">a live 443 rule from a real security group -- and state list still looked fine</text></svg>