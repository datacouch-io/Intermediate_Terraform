<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#40474f"/></marker></defs><rect width="900" height="900" fill="#ffffff"/><text x="24" y="42" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#1b1f23">Lab 6 — four errors, four different stages</text><text x="24" y="66" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#5a636c">Where an error surfaces tells you what kind of error it is.</text><rect x="24" y="80" width="852" height="135" rx="7" fill="#fdf0e3" stroke="#a5651a" stroke-width="1.4"/><text x="38" y="101" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#a5651a">STAGE 1  —  terraform init / validate   (no AWS contact at all)</text><text x="38" y="118" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">ERROR 1  Unclosed configuration block   &lt;- HCL syntax</text><text x="38" y="135" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">on main.tf line 11, in resource "aws_instance" "app"</text><text x="38" y="152" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">blames the OUTERMOST unclosed block, not the line you forgot</text><text x="38" y="169" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">init REFUSES to run: config must parse before providers install</text><text x="38" y="186" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">ERROR 2  Missing resource instance key   &lt;- count reference</text><line x1="450" y1="219" x2="450" y2="240" stroke="#40474f" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="234" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#2b5fa8">fix, re-run</text><rect x="24" y="249" width="852" height="118" rx="7" fill="#fdf0e3" stroke="#a5651a" stroke-width="1.4"/><text x="38" y="270" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#a5651a">STAGE 2  —  terraform plan   (evaluates values; still creates nothing)</text><text x="38" y="287" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">ERROR 3  Invalid index: aws_instance.bastion is empty tuple</text><text x="38" y="304" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">the OBVIOUS fix [0] passes validate and fails here</text><text x="38" y="321" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">validate never evaluates variable VALUES -- that is the gap</text><text x="38" y="338" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">correct: one(aws_instance.bastion[*].public_ip) -&gt; null when disabled</text><line x1="450" y1="371" x2="450" y2="392" stroke="#40474f" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="386" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#2b5fa8">fix, re-run</text><rect x="24" y="401" width="852" height="118" rx="7" fill="#fdf0e3" stroke="#a5651a" stroke-width="1.4"/><text x="38" y="422" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#a5651a">STAGE 3  —  terraform apply   (the AWS API answers)</text><text x="38" y="439" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">ERROR 4  api error InvalidAMIID.Malformed  (400)   bogus id</text><text x="38" y="456" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">         api error InvalidAMIID.NotFound   (400)   real AMI, wrong region</text><text x="38" y="473" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">         api error InvalidParameterValue   (400)   t3.enormous</text><text x="38" y="490" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">plan said 1 to add for every one of these -- plan cannot check an AMI</text><line x1="450" y1="523" x2="450" y2="544" stroke="#40474f" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="538" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#2b5fa8">TF_LOG=DEBUG</text><rect x="24" y="553" width="852" height="118" rx="7" fill="#f4f6f8" stroke="#40474f" stroke-width="1.4"/><text x="38" y="574" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#40474f">WHEN THE MESSAGE IS NOT ENOUGH</text><text x="38" y="591" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">TF_LOG=DEBUG TF_LOG_PATH=./debug.log terraform apply</text><text x="38" y="608" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">368 lines / 56K for one failed instance launch</text><text x="38" y="625" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">contains the raw request: Action=RunInstances&amp;ClientToken=...</text><text x="38" y="642" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">and the raw response: &lt;Code&gt;InvalidAMIID.NotFound&lt;/Code&gt;</text><line x1="450" y1="675" x2="450" y2="696" stroke="#40474f" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="690" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#2b5fa8">all four fixed</text><rect x="24" y="705" width="852" height="118" rx="7" fill="#e6f4ea" stroke="#1e7a45" stroke-width="1.4"/><text x="38" y="726" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1e7a45">CLEAN APPLY</text><text x="38" y="743" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">Apply complete! Resources: 1 added, 0 changed, 0 destroyed.</text><text x="38" y="760" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">app_id = i-024337bacac82e17e</text><text x="38" y="777" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">bastion disabled -&gt; bastion_ip omitted;  enabled -&gt; 54.167.20.183</text><text x="38" y="794" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">validation: 8 checks pass, including 'plan emits no errors'</text></svg>