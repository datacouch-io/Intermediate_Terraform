<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#40474f"/></marker></defs><rect width="900" height="900" fill="#ffffff"/><text x="24" y="42" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#1b1f23">Lab 2 — the same instance, with every hardcoded value removed</text><text x="24" y="66" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#5a636c">Inputs on the left, computed values in the middle, one resource and one side effect on the right.</text><rect x="24" y="80" width="416" height="118" rx="7" fill="#e8f0fb" stroke="#2b5fa8" stroke-width="1.4"/><text x="38" y="101" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#2b5fa8">variables.tf</text><text x="38" y="118" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">declares name, type, default,</text><text x="38" y="135" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">description and validation rules</text><text x="38" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">project_name, environment,</text><text x="38" y="169" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">instance_type, owner, aws_region</text><rect x="460" y="80" width="416" height="118" rx="7" fill="#e8f0fb" stroke="#2b5fa8" stroke-width="1.4"/><text x="474" y="101" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#2b5fa8">terraform.tfvars</text><text x="474" y="118" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">assigns the values for THIS</text><text x="474" y="135" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">deployment (git-ignored)</text><text x="474" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">environment = "dev"</text><text x="474" y="169" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">instance_type = "t3.micro"</text><line x1="450" y1="202" x2="450" y2="223" stroke="#40474f" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="217" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#2b5fa8">evaluated</text><rect x="24" y="232" width="416" height="118" rx="7" fill="#f4f6f8" stroke="#40474f" stroke-width="1.4"/><text x="38" y="253" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#40474f">locals.tf</text><text x="38" y="270" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">name_prefix = tflab-dev</text><text x="38" y="287" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">common_tags = { Project, Environment,</text><text x="38" y="304" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">  Owner, ManagedBy, Course, Lab }</text><text x="38" y="321" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">computed once, reused everywhere</text><rect x="460" y="232" width="416" height="118" rx="7" fill="#f4f6f8" stroke="#40474f" stroke-width="1.4"/><text x="474" y="253" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#40474f">data.tf  (reads AWS, creates nothing)</text><text x="474" y="270" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">data "aws_ami" "al2023"</text><text x="474" y="287" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">-&gt; ami-025b6f0b1ac2ef9f7</text><text x="474" y="304" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">data "aws_caller_identity"</text><text x="474" y="321" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">data "aws_region" -&gt; us-east-1</text><line x1="450" y1="354" x2="450" y2="375" stroke="#40474f" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="369" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#2b5fa8">terraform apply</text><rect x="24" y="384" width="416" height="118" rx="7" fill="#e6f4ea" stroke="#1e7a45" stroke-width="1.4"/><text x="38" y="405" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1e7a45">aws_instance.app</text><text x="38" y="422" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">ami from the data source</text><text x="38" y="439" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">instance_type from the variable</text><text x="38" y="456" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">tags = merge(common_tags, {Name})</text><text x="38" y="473" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">-&gt; i-0524a0ee6a74f4121  (17s)</text><rect x="460" y="384" width="416" height="118" rx="7" fill="#e6f4ea" stroke="#1e7a45" stroke-width="1.4"/><text x="474" y="405" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1e7a45">null_resource.record_deployment</text><text x="474" y="422" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">local-exec runs on YOUR machine</text><text x="474" y="439" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">writes deployment.txt</text><text x="474" y="456" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">re-runs only when a trigger changes</text><text x="474" y="473" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">-&gt; instance_id, public_ip, name_prefix</text><line x1="450" y1="506" x2="450" y2="527" stroke="#40474f" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="521" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#2b5fa8">change ONE variable</text><rect x="24" y="536" width="852" height="135" rx="7" fill="#fdf0e3" stroke="#a5651a" stroke-width="1.4"/><text x="38" y="557" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#a5651a">THE DEMONSTRATION</text><text x="38" y="574" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">instance_type: t3.micro -&gt; t3.small  in terraform.tfvars</text><text x="38" y="591" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">plan: 1 to add, 1 to change, 1 to destroy</text><text x="38" y="608" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">instance updated IN PLACE (same ID), public IP reassigned 3.80.46.96 -&gt; 3.94.195.189</text><text x="38" y="625" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">null_resource REPLACED because its public_ip trigger changed -&gt; deployment.txt rewritten</text><text x="38" y="642" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">no .tf file was edited to make any of this happen</text></svg>