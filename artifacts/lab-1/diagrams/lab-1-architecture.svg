<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#40474f"/></marker></defs><rect width="900" height="900" fill="#ffffff"/><text x="24" y="42" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#1b1f23">Lab 1 — one file, three commands, one running instance</text><text x="24" y="66" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#5a636c">The whole Terraform core loop, with nothing else in the way.</text><rect x="24" y="80" width="852" height="118" rx="7" fill="#e8f0fb" stroke="#2b5fa8" stroke-width="1.4"/><text x="38" y="101" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#2b5fa8">main.tf  (the only file you write)</text><text x="38" y="118" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">terraform { required_providers { aws ~&gt; 6.0 } }</text><text x="38" y="135" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">provider "aws" { region = "us-east-1" }</text><text x="38" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">resource "aws_instance" "lab" { ami, instance_type, tags }</text><text x="38" y="169" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">output "instance_id" / "instance_public_ip"</text><line x1="450" y1="202" x2="450" y2="223" stroke="#40474f" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="217" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#2b5fa8">terraform init</text><rect x="24" y="232" width="852" height="101" rx="7" fill="#f4f6f8" stroke="#40474f" stroke-width="1.4"/><text x="38" y="253" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#40474f">Initialised working directory</text><text x="38" y="270" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">downloads hashicorp/aws v6.63.0 into .terraform/</text><text x="38" y="287" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">writes .terraform.lock.hcl  (commit this file)</text><text x="38" y="304" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">no AWS API calls yet, and no state file yet</text><line x1="450" y1="337" x2="450" y2="358" stroke="#40474f" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="352" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#2b5fa8">terraform plan</text><rect x="24" y="367" width="852" height="101" rx="7" fill="#f4f6f8" stroke="#40474f" stroke-width="1.4"/><text x="38" y="388" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#40474f">Execution plan</text><text x="38" y="405" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">reads config, reads state (empty), asks AWS nothing it can compute</text><text x="38" y="422" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">prints: Plan: 1 to add, 0 to change, 0 to destroy</text><text x="38" y="439" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">every unknown value shows as (known after apply)</text><line x1="450" y1="472" x2="450" y2="493" stroke="#40474f" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="487" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#2b5fa8">terraform apply</text><rect x="24" y="502" width="852" height="101" rx="7" fill="#e6f4ea" stroke="#1e7a45" stroke-width="1.4"/><text x="38" y="523" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1e7a45">Real infrastructure + state</text><text x="38" y="540" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">EC2 RunInstances -&gt; i-063bf80b54cbdd3d7 in 18s</text><text x="38" y="557" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">terraform.tfstate written locally, mapping config -&gt; real ID</text><text x="38" y="574" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">outputs resolved: public IP 52.23.237.145</text><line x1="450" y1="607" x2="450" y2="628" stroke="#40474f" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="622" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#2b5fa8">verify</text><rect x="24" y="637" width="852" height="101" rx="7" fill="#e6f4ea" stroke="#1e7a45" stroke-width="1.4"/><text x="38" y="658" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1e7a45">Proof it is real</text><text x="38" y="675" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">terraform state list  -&gt; aws_instance.lab</text><text x="38" y="692" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">aws ec2 describe-instances  -&gt; State: running</text><text x="38" y="709" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">the AWS Console shows the same instance ID</text><line x1="450" y1="742" x2="450" y2="763" stroke="#40474f" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="757" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#2b5fa8">terraform destroy</text><rect x="24" y="772" width="852" height="101" rx="7" fill="#fdf0e3" stroke="#a5651a" stroke-width="1.4"/><text x="38" y="793" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#a5651a">Back to zero</text><text x="38" y="810" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">Destroy complete! Resources: 1 destroyed  (32s)</text><text x="38" y="827" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">state file remains, now empty of resources</text><text x="38" y="844" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">billing stops</text></svg>