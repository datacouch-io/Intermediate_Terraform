<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#40474f"/></marker></defs><rect width="900" height="900" fill="#ffffff"/><text x="24" y="42" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#1b1f23">Lab 8 — a fleet from one block, state that lives somewhere real</text><text x="24" y="66" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#5a636c">count for interchangeable copies; S3 for state a team can share.</text><rect x="24" y="80" width="852" height="135" rx="7" fill="#e8f0fb" stroke="#2b5fa8" stroke-width="1.4"/><text x="38" y="101" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#2b5fa8">BOOTSTRAP — the chicken-and-egg problem</text><text x="38" y="118" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">a remote backend needs an S3 bucket, but this config cannot store its own state there</text><text x="38" y="135" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">so the bootstrap keeps LOCAL state, deliberately, and stays tiny</text><text x="38" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">aws_s3_bucket + versioning + AES256 + public-access-block</text><text x="38" y="169" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">aws_dynamodb_table PAY_PER_REQUEST  (legacy locking, see below)</text><text x="38" y="186" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">random_id suffix: S3 bucket names are globally unique across ALL of AWS</text><line x1="450" y1="219" x2="450" y2="240" stroke="#40474f" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="234" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#2b5fa8">terraform apply</text><rect x="24" y="249" width="852" height="135" rx="7" fill="#e6f4ea" stroke="#1e7a45" stroke-width="1.4"/><text x="38" y="270" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1e7a45">THE LOOP — one block, N instances</text><text x="38" y="287" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">resource "aws_instance" "fleet" { count = var.fleet_size }</text><text x="38" y="304" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">Name = format("tflab8-node-%02d", count.index + 1)  -&gt; node-01, not node-1</text><text x="38" y="321" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">3 instances created in parallel, 18s</text><text x="38" y="338" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">count is RIGHT here: these servers are interchangeable and have no identity</text><text x="38" y="355" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">(contrast Lab 7, where each resource had a name -&gt; for_each)</text><line x1="450" y1="388" x2="450" y2="409" stroke="#40474f" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="403" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#2b5fa8">add backend.tf, terraform init -migrate-state</text><rect x="24" y="418" width="416" height="118" rx="7" fill="#fdf0e3" stroke="#a5651a" stroke-width="1.4"/><text x="38" y="439" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#a5651a">before</text><text x="38" y="456" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">./terraform.tfstate  24,506 bytes</text><text x="38" y="473" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">on one laptop</text><text x="38" y="490" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">no locking</text><text x="38" y="507" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">no history</text><rect x="460" y="418" width="416" height="118" rx="7" fill="#e6f4ea" stroke="#1e7a45" stroke-width="1.4"/><text x="474" y="439" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1e7a45">after</text><text x="474" y="456" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">s3://tflab8-tfstate-.../lab8/fleet/terraform.tfstate</text><text x="474" y="473" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">23.9 KiB, ServerSideEncryption: AES256</text><text x="474" y="490" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">versioned, public access blocked</text><text x="474" y="507" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">local file emptied to 0 bytes; .backup keeps the old copy</text><line x1="450" y1="540" x2="450" y2="561" stroke="#40474f" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="555" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#2b5fa8">the proof</text><rect x="24" y="570" width="852" height="118" rx="7" fill="#e6f4ea" stroke="#1e7a45" stroke-width="1.4"/><text x="38" y="591" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1e7a45">A SECOND SESSION, WITH NO LOCAL STATE</text><text x="38" y="608" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">a fresh directory holding only main.tf, backend.tf, user-data.sh.tftpl</text><text x="38" y="625" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">terraform init  -&gt; Successfully configured the backend "s3"!</text><text x="38" y="642" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">terraform state list -&gt; aws_instance.fleet[0..2]</text><text x="38" y="659" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">terraform plan -&gt; no changes. It has never run an apply.</text><line x1="450" y1="692" x2="450" y2="713" stroke="#40474f" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="707" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#2b5fa8">two sessions at once</text><rect x="24" y="722" width="852" height="118" rx="7" fill="#fdf0e3" stroke="#a5651a" stroke-width="1.4"/><text x="38" y="743" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#a5651a">LOCKING, MEASURED</text><text x="38" y="760" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">session A: terraform apply -var fleet_size=5   (holds the lock)</text><text x="38" y="777" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">session B: terraform plan -&gt; StatusCode: 412 PreconditionFailed</text><text x="38" y="794" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">Lock Info: Operation: OperationTypeApply, Who: &lt;USER&gt;@&lt;HOSTNAME&gt;</text><text x="38" y="811" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">dynamodb_table is DEPRECATED in 1.15: use use_lockfile = true</text></svg>