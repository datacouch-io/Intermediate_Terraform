<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#40474f"/></marker></defs><rect width="900" height="900" fill="#ffffff"/><text x="24" y="42" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#1b1f23">Lab 4 — nine resources, one web page</text><text x="24" y="66" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#5a636c">A purpose-built VPC instead of the default one, and the single route that makes it public.</text><rect x="24" y="80" width="852" height="135" rx="7" fill="#e8f0fb" stroke="#2b5fa8" stroke-width="1.4"/><text x="38" y="101" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#2b5fa8">NETWORK — built, not borrowed</text><text x="38" y="118" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">aws_vpc.main            10.20.0.0/16, DNS support + hostnames on</text><text x="38" y="135" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">aws_internet_gateway    without this the subnet is private, whatever else you do</text><text x="38" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">aws_subnet.public       cidrsubnet(vpc_cidr, 8, 1) -&gt; 10.20.1.0/24, AZ us-east-1a</text><text x="38" y="169" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">aws_route_table.public  0.0.0.0/0 -&gt; igw   &lt;-- THE line that makes it public</text><text x="38" y="186" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">aws_route_table_association  binds the table to the subnet</text><line x1="450" y1="219" x2="450" y2="240" stroke="#40474f" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="234" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#2b5fa8">reachability</text><rect x="24" y="249" width="852" height="118" rx="7" fill="#f4f6f8" stroke="#40474f" stroke-width="1.4"/><text x="38" y="270" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#40474f">SECURITY GROUP — rules as separate resources</text><text x="38" y="287" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">aws_security_group.web               the container, no inline rules</text><text x="38" y="304" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">aws_vpc_security_group_ingress_rule  tcp/80 from 0.0.0.0/0</text><text x="38" y="321" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">aws_vpc_security_group_egress_rule   all outbound, needed to dnf install nginx</text><text x="38" y="338" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">inline ingress/egress blocks are exhaustive and fight out-of-band edits</text><line x1="450" y1="371" x2="450" y2="392" stroke="#40474f" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="386" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#2b5fa8">compute</text><rect x="24" y="401" width="852" height="135" rx="7" fill="#e6f4ea" stroke="#1e7a45" stroke-width="1.4"/><text x="38" y="422" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1e7a45">INSTANCE + USER DATA</text><text x="38" y="439" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">data.aws_ami.al2023 -&gt; current AL2023 image</text><text x="38" y="456" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">templatefile("user-data.sh.tftpl", { project_name, region })</text><text x="38" y="473" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">user_data_replace_on_change = true -&gt; editing the script REPLACES the instance</text><text x="38" y="490" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">script installs nginx, reads IMDSv2 with a token, writes index.html</text><text x="38" y="507" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">-&gt; i-0a7d82909624b4483 in us-east-1a, private 10.20.1.182</text><line x1="450" y1="540" x2="450" y2="561" stroke="#40474f" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="555" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#2b5fa8">the visible result</text><rect x="24" y="570" width="852" height="101" rx="7" fill="#e6f4ea" stroke="#1e7a45" stroke-width="1.4"/><text x="38" y="591" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1e7a45">A LIVE WEB PAGE</text><text x="38" y="608" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">http://34.230.62.70  reachable 16s after apply completed</text><text x="38" y="625" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">HTTP/1.1 200 OK   Server: nginx/1.30.4   Content-Length: 732</text><text x="38" y="642" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">page reports its own instance-id, AZ, private + public IP, build time</text><line x1="450" y1="675" x2="450" y2="696" stroke="#40474f" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="690" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#2b5fa8">what actually makes it work</text><rect x="24" y="705" width="852" height="118" rx="7" fill="#fdf0e3" stroke="#a5651a" stroke-width="1.4"/><text x="38" y="726" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#a5651a">REMOVE ONE ROUTE AND IT ALL STOPS</text><text x="38" y="743" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">aws ec2 delete-route --destination-cidr-block 0.0.0.0/0</text><text x="38" y="760" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">instance state: running       port 80 open: yes       curl: 000 TIMEOUT</text><text x="38" y="777" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">nothing is broken except one row in one route table</text><text x="38" y="794" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">terraform plan -&gt; + cidr_block 0.0.0.0/0, + gateway_id igw-...  ; apply restores it in 3s</text></svg>