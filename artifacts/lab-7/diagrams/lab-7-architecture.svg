<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#40474f"/></marker></defs><rect width="900" height="900" fill="#ffffff"/><text x="24" y="42" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#1b1f23">Lab 7 — one list in, three servers out</text><text x="24" y="66" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#5a636c">Every resource name, size and tag is computed. None is typed.</text><rect x="24" y="80" width="852" height="118" rx="7" fill="#e8f0fb" stroke="#2b5fa8" stroke-width="1.4"/><text x="38" y="101" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#2b5fa8">THE ONLY THING A HUMAN EDITS</text><text x="38" y="118" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">variable "environments" = ["dev", "staging", "prod"]</text><text x="38" y="135" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">variable "owner_csv" = " platform@example.com, sre@example.com ,data@example.com "</text><text x="38" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">variable "size_map" = { prod = "t3.small", staging = "t3.micro" }</text><text x="38" y="169" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">variable "production_envs" = ["prod"]</text><line x1="450" y1="202" x2="450" y2="223" stroke="#40474f" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="217" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#2b5fa8">functions</text><rect x="24" y="232" width="416" height="135" rx="7" fill="#f4f6f8" stroke="#40474f" stroke-width="1.4"/><text x="38" y="253" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#40474f">list -&gt; map (the key conversion)</text><text x="38" y="270" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">{ for env in var.environments : env =&gt; {...} }</text><text x="38" y="287" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">join("-", [project, env])  -&gt; tflab7-dev</text><text x="38" y="304" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">lookup(size_map, env, "t3.micro")</text><text x="38" y="321" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">contains(production_envs, env)</text><text x="38" y="338" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">index(var.environments, env)</text><rect x="460" y="232" width="416" height="135" rx="7" fill="#f4f6f8" stroke="#40474f" stroke-width="1.4"/><text x="474" y="253" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#40474f">cleaning + display strings</text><text x="474" y="270" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">split(",", owner_csv)  -&gt; 3 messy strings</text><text x="474" y="287" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">trimspace(o)          -&gt; spaces gone</text><text x="474" y="304" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">element(split("@",o),1) -&gt; example.com</text><text x="474" y="321" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">distinct(...)          -&gt; one domain</text><text x="474" y="338" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">upper(substr(env,0,3)) -&gt; DEV / STA / PRO</text><line x1="450" y1="371" x2="450" y2="392" stroke="#40474f" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="386" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#2b5fa8">for_each = local.env_map</text><rect x="24" y="401" width="852" height="118" rx="7" fill="#e6f4ea" stroke="#1e7a45" stroke-width="1.4"/><text x="38" y="422" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1e7a45">THREE INSTANCES, NAMED BY THE FUNCTIONS</text><text x="38" y="439" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">aws_instance.env["dev"]      tflab7-dev      t3.micro   DEV  idx 0  prod=false</text><text x="38" y="456" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">aws_instance.env["staging"]  tflab7-staging  t3.micro   STA  idx 1  prod=false</text><text x="38" y="473" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">aws_instance.env["prod"]     tflab7-prod     t3.small   PRO  idx 2  prod=true</text><text x="38" y="490" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">shared tags: EnvCount=3, AllEnvs=dev,staging,prod, OwnerDomains=example.com</text><line x1="450" y1="523" x2="450" y2="544" stroke="#40474f" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="538" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#2b5fa8">change ONLY the list</text><rect x="24" y="553" width="852" height="135" rx="7" fill="#fdf0e3" stroke="#a5651a" stroke-width="1.4"/><text x="38" y="574" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#a5651a">INFRASTRUCTURE FOLLOWS</text><text x="38" y="591" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">environments = ["dev", "prod", "qa"]   (staging removed from the MIDDLE)</text><text x="38" y="608" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">aws_instance.env["qa"]      will be created</text><text x="38" y="625" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">aws_instance.env["staging"] will be destroyed</text><text x="38" y="642" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">aws_instance.env["dev"] / ["prod"] updated in place (their computed tags moved)</text><text x="38" y="659" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">Plan: 1 to add, 2 to change, 1 to destroy</text><line x1="450" y1="692" x2="450" y2="713" stroke="#40474f" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="707" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#2b5fa8">why for_each, not count</text><rect x="24" y="722" width="852" height="135" rx="7" fill="#fdf0e3" stroke="#a5651a" stroke-width="1.4"/><text x="38" y="743" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#a5651a">THE SAME CHANGE UNDER count</text><text x="38" y="760" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">terraform_data.by_count[1]  ~ input = "staging" -&gt; "prod"</text><text x="38" y="777" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">terraform_data.by_count[2]  will be destroyed</text><text x="38" y="794" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">slot [1] CHANGES IDENTITY: prod shifts down into staging's address</text><text x="38" y="811" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">terraform_data.by_foreach["staging"] will be destroyed  &lt;- and nothing else</text><text x="38" y="828" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">for an EC2 instance, that renumbering is a destroy-and-recreate of prod</text></svg>