<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#40474f"/></marker></defs><rect width="900" height="900" fill="#ffffff"/><text x="24" y="42" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#1b1f23">Lab 9 — a resource type the course never taught you</text><text x="24" y="66" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#5a636c">No starter code. The Terraform Registry documentation is the only input.</text><rect x="24" y="80" width="852" height="118" rx="7" fill="#e8f0fb" stroke="#2b5fa8" stroke-width="1.4"/><text x="38" y="101" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#2b5fa8">WHAT YOU ARE GIVEN</text><text x="38" y="118" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">a goal: serve a web page with NO EC2 instance and NO web server</text><text x="38" y="135" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">acceptance criteria you can run yourself (validate.sh)</text><text x="38" y="152" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">the Registry URL: registry.terraform.io/providers/hashicorp/aws/latest/docs</text><text x="38" y="169" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">NOT given: resource names, arguments, examples, or a starter file</text><line x1="450" y1="202" x2="450" y2="223" stroke="#40474f" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="217" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#2b5fa8">read the docs</text><rect x="24" y="232" width="852" height="152" rx="7" fill="#f4f6f8" stroke="#40474f" stroke-width="1.4"/><text x="38" y="253" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#40474f">WHAT THE DOCS MAKE YOU DISCOVER</text><text x="38" y="270" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">one bucket needs SEVEN resources, not one</text><text x="38" y="287" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">aws_s3_bucket is only the container -- website config is a SEPARATE resource</text><text x="38" y="304" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">aws_s3_bucket_website_configuration  index_document + error_document</text><text x="38" y="321" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">aws_s3_bucket_public_access_block    defaults to blocking everything</text><text x="38" y="338" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">aws_s3_bucket_policy                 the supported way to grant public read</text><text x="38" y="355" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">aws_s3_object x2                     the pages themselves</text><line x1="450" y1="388" x2="450" y2="409" stroke="#40474f" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="403" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#2b5fa8">the traps</text><rect x="24" y="418" width="852" height="118" rx="7" fill="#fdf0e3" stroke="#a5651a" stroke-width="1.4"/><text x="38" y="439" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#a5651a">THREE THINGS THE OBVIOUS READING GETS WRONG</text><text x="38" y="456" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">acl = "public-read" FAILS: modern buckets have ACLs disabled by default</text><text x="38" y="473" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">the bucket POLICY is rejected unless the public access block is relaxed FIRST</text><text x="38" y="490" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">content_type = "text/html" without a charset -&gt; every em dash renders as mojibake</text><text x="38" y="507" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">measured: the page really did show "a EUR" until charset=utf-8 was added</text><line x1="450" y1="540" x2="450" y2="561" stroke="#40474f" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="555" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#2b5fa8">terraform apply</text><rect x="24" y="570" width="852" height="118" rx="7" fill="#e6f4ea" stroke="#1e7a45" stroke-width="1.4"/><text x="38" y="591" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1e7a45">THE VISIBLE RESULT</text><text x="38" y="608" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">Apply complete! Resources: 7 added</text><text x="38" y="625" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">http://tflab9-site-e5e295a2.s3-website-us-east-1.amazonaws.com</text><text x="38" y="642" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1b1f23">HTTP/1.1 200 OK   Server: AmazonS3   Content-Type: text/html; charset=utf-8</text><text x="38" y="659" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">a missing page -&gt; HTTP 404 + the CUSTOM error document</text><line x1="450" y1="692" x2="450" y2="713" stroke="#40474f" stroke-width="1.6" marker-end="url(#a)"/><text x="462" y="707" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#2b5fa8">the check that proves understanding</text><rect x="24" y="722" width="852" height="135" rx="7" fill="#e6f4ea" stroke="#1e7a45" stroke-width="1.4"/><text x="38" y="743" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1e7a45">WEBSITE ENDPOINT vs REST ENDPOINT</text><text x="38" y="760" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">website endpoint  /              -&gt; 200   serves index.html</text><text x="38" y="777" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">website endpoint  /missing.html  -&gt; 404   serves error.html</text><text x="38" y="794" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">REST endpoint     /              -&gt; 403   no index document support</text><text x="38" y="811" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">REST endpoint     /index.html    -&gt; 200   it is just object storage</text><text x="38" y="828" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5a636c">getting a 200 from the REST endpoint is NOT completing this lab</text></svg>